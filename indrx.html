<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPlan AI / MyDay</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#FFF9E6',
                            100: '#FFF6E0',
                            200: '#FFE9A8',
                            400: '#FFE082',
                            500: '#FFD54F', // Primary active
                            600: '#FFC107',
                            800: '#8C5E34',
                            900: '#5B3A1E'  // Dark Accent
                        },
                        tag: {
                            open: '#F5E6C8',
                            done: '#C8E6C9',
                            important: '#FFE082',
                            due: '#FFAB91'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar & mobile frame styling */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 4px;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-0 md:p-4 text-gray-800 font-sans">

    <!-- Phone Frame Container -->
    <div class="w-full max-w-md h-[100vh] md:h-[840px] bg-white md:rounded-[40px] shadow-2xl flex flex-col overflow-hidden border-0 md:border-[8px] border-gray-800 relative">
        
        <!-- Status Bar Mockup -->
        <div class="bg-white px-6 pt-3 pb-1 flex justify-between items-center text-xs text-gray-500 font-medium select-none z-10">
            <span id="current-time">09:41</span>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full text-sm"></i>
            </div>
        </div>

        <!-- App Header -->
        <header class="bg-white px-5 py-3 border-b border-gray-100 flex justify-between items-center z-10">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-full bg-brand-500 flex items-center justify-center text-brand-900 font-bold text-sm">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1 class="text-lg font-bold text-brand-900 tracking-tight">StudyPlan AI</h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleNotifications()" class="relative p-2 text-gray-600 hover:text-brand-900 transition">
                    <i class="fa-regular fa-bell text-lg"></i>
                    <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                </button>
            </div>
        </header>

        <!-- Dynamic Main Content Scrollable Area -->
        <main id="app-content" class="flex-1 overflow-y-auto bg-gray-50 p-4 hide-scrollbar pb-24">
            <!-- Content will be rendered dynamically by JS -->
        </main>

        <!-- Floating Add Button (Visible on Home & Tasks) -->
        <button id="floating-add-btn" onclick="openAddTaskModal()" class="fixed md:absolute bottom-20 right-6 md:right-8 w-14 h-14 bg-brand-500 hover:bg-brand-600 text-brand-900 rounded-full shadow-lg flex items-center justify-center text-xl transition-all transform active:scale-95 z-20">
            <i class="fa-solid fa-plus"></i>
        </button>

        <!-- Bottom Navigation Bar -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-3 py-2 flex justify-around items-center z-30">
            <button onclick="switchTab('heute')" id="nav-heute" class="nav-btn flex flex-col items-center gap-1 text-xs font-semibold text-brand-900">
                <i class="fa-solid fa-house text-lg"></i>
                <span>Heute</span>
            </button>
            <button onclick="switchTab('plan')" id="nav-plan" class="nav-btn flex flex-col items-center gap-1 text-xs font-medium text-gray-400 hover:text-brand-900">
                <i class="fa-solid fa-calendar-days text-lg"></i>
                <span>Plan</span>
            </button>
            <button onclick="switchTab('aufgaben')" id="nav-aufgaben" class="nav-btn flex flex-col items-center gap-1 text-xs font-medium text-gray-400 hover:text-brand-900">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span>Aufgaben</span>
            </button>
            <button onclick="switchTab('lernen')" id="nav-lernen" class="nav-btn flex flex-col items-center gap-1 text-xs font-medium text-gray-400 hover:text-brand-900">
                <i class="fa-solid fa-stopwatch text-lg"></i>
                <span>Lernen</span>
            </button>
            <button onclick="switchTab('profil')" id="nav-profil" class="nav-btn flex flex-col items-center gap-1 text-xs font-medium text-gray-400 hover:text-brand-900">
                <i class="fa-solid fa-user text-lg"></i>
                <span>Profil</span>
            </button>
        </nav>

        <!-- Add Task Modal -->
        <div id="add-modal" class="hidden absolute inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-end md:items-center justify-center p-0 md:p-4 transition-opacity">
            <div class="bg-white w-full max-w-sm rounded-t-3xl md:rounded-3xl p-6 shadow-xl transform transition-all">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-brand-900">Neue Aufgabe</h3>
                    <button onclick="closeAddTaskModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fa-solid fa-xmark text-xl"></i>
                    </button>
                </div>
                <form id="add-task-form" onsubmit="handleAddTask(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Titel der Aufgabe</label>
                        <input type="text" id="task-title" required placeholder="z.B. Mathe Hausaufgaben" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-500 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Fach / Kategorie</label>
                            <select id="task-subject" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-500 text-sm bg-white">
                                <option value="Mathe">Mathe</option>
                                <option value="Deutsch">Deutsch</option>
                                <option value="Englisch">Englisch</option>
                                <option value="Biologie">Biologie</option>
                                <option value="Sonstiges">Sonstiges</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Dauer (Min)</label>
                            <input type="number" id="task-duration" value="45" min="5" step="5" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-500 text-sm">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Uhrzeit</label>
                            <input type="time" id="task-time" value="14:30" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-500 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">Wochentag</label>
                            <select id="task-day" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 focus:outline-none focus:border-brand-500 text-sm bg-white">
                                <option value="Mo">Montag</option>
                                <option value="Di">Dienstag</option>
                                <option value="Mi">Mittwoch</option>
                                <option value="Do" selected>Donnerstag</option>
                                <option value="Fr">Freitag</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit" class="w-full py-3 bg-brand-500 hover:bg-brand-600 text-brand-900 font-bold rounded-xl shadow transition mt-2">
                        Speichern
                    </button>
                </form>
            </div>
        </div>

    </div>

    <!-- Application State & Scripting -->
    <script>
        // Initial Data Structure
        const defaultTasks = [
            { id: 1, title: 'Schule', subject: 'Sonstiges', time: '08:00', duration: '6 Std', day: 'Do', completed: true },
            { id: 2, title: 'Mathe lernen', subject: 'Mathe', time: '14:30', duration: '45 Min', day: 'Do', completed: false },
            { id: 3, title: 'Hausaufgaben Textanalyse', subject: 'Deutsch', time: '16:00', duration: '1 Std', day: 'Do', completed: false },
            { id: 4, title: 'Fußball Training', subject: 'Sonstiges', time: '18:00', duration: '1.5 Std', day: 'Do', completed: false },
            { id: 5, title: 'Englisch Vokabeln', subject: 'Englisch', time: '20:00', duration: '30 Min', day: 'Do', completed: false }
        ];

        let tasks = JSON.parse(localStorage.getItem('studyplan_tasks')) || defaultTasks;
        let currentTab = 'heute';
        let currentFilter = 'Alle';

        // Timer States
        let timerSeconds = 45 * 60;
        let timerTotal = 45 * 60;
        let timerInterval = null;
        let isTimerRunning = false;

        // Save to localStorage
        function saveTasks() {
            localStorage.setItem('studyplan_tasks', JSON.stringify(tasks));
        }

        // Live Clock
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('current-time').innerText = `${hours}:${mins}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Navigation Switcher
        function switchTab(tab) {
            currentTab = tab;
            
            // Update Tab UI active states
            const navs = ['heute', 'plan', 'aufgaben', 'lernen', 'profil'];
            navs.forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.className = "nav-btn flex flex-col items-center gap-1 text-xs font-semibold text-brand-900 transition";
                } else {
                    btn.className = "nav-btn flex flex-col items-center gap-1 text-xs font-medium text-gray-400 hover:text-brand-900 transition";
                }
            });

            // Toggle Floating Action Button visibility
            const floatBtn = document.getElementById('floating-add-btn');
            if (tab === 'heute' || tab === 'aufgaben' || tab === 'plan') {
                floatBtn.classList.remove('hidden');
            } else {
                floatBtn.classList.add('hidden');
            }

            renderContent();
        }

        // Toggle Task Status
        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            saveTasks();
            renderContent();
        }

        // Delete Task
        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            renderContent();
        }

        // Render Page Views
        function renderContent() {
            const container = document.getElementById('app-content');
            
            if (currentTab === 'heute') {
                const total = tasks.length;
                const completedCount = tasks.filter(t => t.completed).length;
                const percent = total > 0 ? Math.round((completedCount / total) * 100) : 0;

                container.innerHTML = `
                    <!-- Greeting & Goal -->
                    <div class="mb-5">
                        <h2 class="text-xl font-bold text-gray-800">Guten Morgen, Max! ☀️</h2>
                        <p class="text-xs text-gray-500 mt-0.5">Bereit für einen produktiven Tag?</p>
                    </div>

                    <!-- Tagesziel Card -->
                    <div class="bg-brand-100 rounded-2xl p-4 mb-6 shadow-sm border border-brand-200/50">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex items-center gap-2">
                                <div class="w-7 h-7 rounded-full bg-brand-500 flex items-center justify-center text-brand-900 text-xs">
                                    <i class="fa-solid fa-bullseye"></i>
                                </div>
                                <span class="font-bold text-sm text-brand-900">Tagesziel</span>
                            </div>
                            <span class="text-xs font-bold text-brand-900 bg-white/70 px-2 py-0.5 rounded-full">${completedCount} / ${total} erledigt</span>
                        </div>
                        <div class="w-full bg-white/80 rounded-full h-2.5 overflow-hidden mb-1">
                            <div class="bg-brand-500 h-2.5 rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                        </div>
                        <p class="text-[11px] text-brand-800 text-right font-medium">${percent}% geschafft</p>
                    </div>

                    <!-- Timeline Header -->
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-sm text-gray-700">Heute – 15. Mai</h3>
                        <span class="text-xs text-gray-400"><i class="fa-regular fa-clock"></i> ${tasks.length} Termine</span>
                    </div>

                    <!-- Timeline List -->
                    <div class="space-y-3 relative before:absolute before:inset-0 before:left-6 before:w-0.5 before:bg-gray-200">
                        ${tasks.map(task => `
                            <div class="flex items-center gap-3 relative z-0">
                                <span class="text-xs font-bold text-gray-400 w-10 text-right">${task.time}</span>
                                <div onclick="toggleTask(${task.id})" class="flex-1 bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex justify-between items-center cursor-pointer hover:border-brand-400 transition">
                                    <div class="flex items-center gap-3">
                                        <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center transition ${task.completed ? 'bg-brand-500 border-brand-500 text-brand-900' : 'border-gray-300'}">
                                            ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                                        </div>
                                        <div>
                                            <p class="text-sm font-semibold ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'}">${task.title}</p>
                                            <span class="text-[10px] px-2 py-0.5 rounded-md bg-gray-100 text-gray-600 font-medium">${task.subject}</span>
                                        </div>
                                    </div>
                                    <span class="text-xs text-gray-400 font-medium">${task.duration}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTab === 'plan') {
                container.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">Wochenplan</h2>
                        <span class="text-xs bg-brand-100 text-brand-900 font-bold px-3 py-1 rounded-full">Mai 12 – 18</span>
                    </div>

                    <!-- Week Selector -->
                    <div class="flex justify-between bg-white p-2 rounded-2xl border border-gray-100 shadow-sm mb-5 text-center">
                        ${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map((day, idx) => `
                            <div class="flex-1 p-2 rounded-xl text-xs cursor-pointer transition ${day === 'Do' ? 'bg-brand-500 text-brand-900 font-bold shadow-sm' : 'text-gray-500 hover:bg-gray-50'}">
                                <p class="text-[10px] uppercase tracking-wider">${day}</p>
                                <p class="font-bold text-sm mt-0.5">${12 + idx}</p>
                            </div>
                        `).join('')}
                    </div>

                    <!-- Schedule Blocks -->
                    <div class="space-y-3">
                        <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Donnerstag Übersicht</h3>
                        ${tasks.map(task => `
                            <div class="bg-white p-3.5 rounded-2xl border-l-4 ${task.completed ? 'border-green-400' : 'border-brand-500'} shadow-sm flex justify-between items-center">
                                <div>
                                    <span class="text-[11px] font-bold text-brand-900">${task.time} Uhr</span>
                                    <h4 class="text-sm font-bold text-gray-800">${task.title}</h4>
                                    <p class="text-xs text-gray-400">${task.subject} • ${task.duration}</p>
                                </div>
                                <span class="text-xs px-2.5 py-1 rounded-full ${task.completed ? 'bg-green-100 text-green-700' : 'bg-brand-100 text-brand-900'} font-bold">
                                    ${task.completed ? 'Erledigt' : 'Geplant'}
                                </span>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTab === 'aufgaben') {
                let filtered = tasks;
                if (currentFilter === 'Offen') filtered = tasks.filter(t => !t.completed);
                if (currentFilter === 'Erledigt') filtered = tasks.filter(t => t.completed);

                container.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">Meine Aufgaben</h2>
                        <span class="text-xs text-gray-400 font-medium">${filtered.length} Einträge</span>
                    </div>

                    <!-- Filter Tabs -->
                    <div class="flex gap-2 mb-4">
                        ${['Alle', 'Offen', 'Erledigt'].map(f => `
                            <button onclick="setFilter('${f}')" class="px-4 py-1.5 rounded-full text-xs font-bold transition ${currentFilter === f ? 'bg-brand-500 text-brand-900 shadow-sm' : 'bg-white text-gray-500 border border-gray-200'}">
                                ${f}
                            </button>
                        `).join('')}
                    </div>

                    <!-- Tasks List -->
                    <div class="space-y-2.5">
                        ${filtered.length === 0 ? '<p class="text-center text-xs text-gray-400 py-8">Keine Aufgaben gefunden</p>' : ''}
                        ${filtered.map(task => `
                            <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between group">
                                <div class="flex items-center gap-3 cursor-pointer flex-1" onclick="toggleTask(${task.id})">
                                    <div class="w-5 h-5 rounded-md border-2 flex items-center justify-center transition ${task.completed ? 'bg-brand-500 border-brand-500 text-brand-900' : 'border-gray-300'}">
                                        ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                                    </div>
                                    <div>
                                        <p class="text-sm font-semibold ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'}">${task.title}</p>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="text-[10px] px-2 py-0.5 rounded-md bg-brand-100 text-brand-900 font-bold">${task.subject}</span>
                                            <span class="text-[11px] text-gray-400"><i class="fa-regular fa-clock"></i> ${task.duration}</span>
                                        </div>
                                    </div>
                                </div>
                                <button onclick="deleteTask(${task.id})" class="text-gray-300 hover:text-red-500 p-2 transition">
                                    <i class="fa-regular fa-trash-can"></i>
                                </button>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (currentTab === 'lernen') {
                const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                const secs = String(timerSeconds % 60).padStart(2, '0');
                const progressPct = ((timerTotal - timerSeconds) / timerTotal) * 100;

                container.innerHTML = `
                    <div class="text-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800">Fokus & KI-Hilfe</h2>
                        <p class="text-xs text-gray-400">Konzentriert lernen mit der Pomodoro-Technik</p>
                    </div>

                    <!-- Timer Circle Card -->
                    <div class="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm flex flex-col items-center mb-6">
                        <div class="relative w-48 h-48 flex items-center justify-center my-2">
                            <!-- Circular Progress SVG -->
                            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                                <path class="text-gray-100" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                                <path class="text-brand-500 transition-all duration-1000" stroke-dasharray="${progressPct}, 100" stroke-width="3" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                            </svg>
                            <div class="absolute flex flex-col items-center">
                                <span class="text-4xl font-extrabold text-brand-900 tracking-tight">${mins}:${secs}</span>
                                <span class="text-xs text-gray-400 font-medium mt-1">Fokuszeit</span>
                            </div>
                        </div>

                        <!-- Timer Controls -->
                        <div class="flex items-center gap-4 mt-2">
                            <button onclick="resetTimer()" class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 flex items-center justify-center hover:bg-gray-200 transition">
                                <i class="fa-solid fa-rotate-left"></i>
                            </button>
                            <button onclick="toggleTimer()" class="w-14 h-14 rounded-full bg-brand-500 text-brand-900 font-bold text-xl flex items-center justify-center shadow-md hover:bg-brand-600 transition">
                                <i class="fa-solid ${isTimerRunning ? 'fa-pause' : 'fa-play ml-1'}"></i>
                            </button>
                            <button onclick="setTimerDuration(25)" class="px-3 py-1.5 rounded-full bg-brand-100 text-brand-900 text-xs font-bold hover:bg-brand-200 transition">
                                25m
                            </button>
                        </div>
                    </div>

                    <!-- KI-Hilfe Box -->
                    <div class="bg-gradient-to-br from-brand-100 to-amber-50 p-4 rounded-2xl border border-brand-200/60 shadow-sm">
                        <div class="flex items-center gap-2 mb-2">
                            <i class="fa-solid fa-wand-magic-sparkles text-brand-900"></i>
                            <h3 class="font-bold text-sm text-brand-900">KI-Lernassistent</h3>
                        </div>
                        <p class="text-xs text-gray-600 mb-3">Du verstehst eine Aufgabe nicht? Stelle hier deine Frage:</p>
                        
                        <div id="ai-chat" class="bg-white p-3 rounded-xl mb-3 text-xs text-gray-700 min-h-[60px] max-h-[120px] overflow-y-auto space-y-2 border border-gray-100">
                            <div class="bg-brand-50 p-2 rounded-lg text-brand-900">
                                💡 <strong>KI:</strong> Hallo Max! Wie kann ich dir heute bei Mathe oder Deutsch helfen?
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <input type="text" id="ai-input" placeholder="Frage eingeben..." class="flex-1 px-3 py-2 rounded-xl text-xs border border-gray-200 focus:outline-none focus:border-brand-500">
                            <button onclick="askAI()" class="px-4 py-2 bg-brand-900 text-white font-bold rounded-xl text-xs hover:bg-black transition">
                                Senden
                            </button>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'profil') {
                const total = tasks.length;
                const completedCount = tasks.filter(t => t.completed).length;

                container.innerHTML = `
                    <div class="text-center mb-6">
                        <div class="w-20 h-20 rounded-full bg-brand-200 border-4 border-brand-500 mx-auto flex items-center justify-center text-2xl text-brand-900 font-bold mb-2 shadow-sm">
                            <i class="fa-solid fa-user-graduate"></i>
                        </div>
                        <h2 class="text-lg font-bold text-gray-800">Max Mustermann</h2>
                        <span class="text-xs bg-brand-100 text-brand-900 font-bold px-3 py-1 rounded-full">Klasse 10b</span>
                    </div>

                    <!-- Statistics Grid -->
                    <div class="grid grid-cols-2 gap-3 mb-6">
                        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm text-center">
                            <span class="text-2xl font-bold text-brand-900">${completedCount}</span>
                            <p class="text-xs text-gray-400 mt-0.5">Erledigte Aufgaben</p>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm text-center">
                            <span class="text-2xl font-bold text-brand-900">4.5 Std</span>
                            <p class="text-xs text-gray-400 mt-0.5">Gelernt diese Woche</p>
                        </div>
                    </div>

                    <!-- Settings List -->
                    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm divide-y divide-gray-100">
                        <div class="p-4 flex justify-between items-center">
                            <span class="text-sm font-semibold text-gray-700"><i class="fa-regular fa-moon mr-2 text-brand-900"></i> Dark Mode</span>
                            <input type="checkbox" class="toggle accent-brand-500 w-4 h-4 cursor-pointer">
                        </div>
                        <div class="p-4 flex justify-between items-center">
                            <span class="text-sm font-semibold text-gray-700"><i class="fa-regular fa-bell mr-2 text-brand-900"></i> Benachrichtigungen</span>
                            <span class="text-xs text-green-600 font-bold">Aktiv</span>
                        </div>
                        <div onclick="resetAllData()" class="p-4 flex justify-between items-center cursor-pointer hover:bg-red-50 transition rounded-b-2xl">
                            <span class="text-sm font-semibold text-red-500"><i class="fa-solid fa-arrow-rotate-left mr-2"></i> Daten zurücksetzen</span>
                        </div>
                    </div>
                `;
            }
        }

        // Modal Controls
        function openAddTaskModal() {
            document.getElementById('add-modal').classList.remove('hidden');
        }
        function closeAddTaskModal() {
            document.getElementById('add-modal').classList.add('hidden');
        }

        // Add Task Logic
        function handleAddTask(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const subject = document.getElementById('task-subject').value;
            const duration = document.getElementById('task-duration').value + ' Min';
            const time = document.getElementById('task-time').value;
            const day = document.getElementById('task-day').value;

            const newTask = {
                id: Date.now(),
                title,
                subject,
                time,
                duration,
                day,
                completed: false
            };

            tasks.push(newTask);
            saveTasks();
            closeAddTaskModal();
            document.getElementById('add-task-form').reset();
            renderContent();
        }

        // Filter Logic
        function setFilter(filter) {
            currentFilter = filter;
            renderContent();
        }

        // Timer Logic
        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
            } else {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        renderContent();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        alert('Zeit abgelaufen! Mache eine Pause.');
                    }
                }, 1000);
            }
            renderContent();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = timerTotal;
            renderContent();
        }

        function setTimerDuration(mins) {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerTotal = mins * 60;
            timerSeconds = timerTotal;
            renderContent();
        }

        // Simulated AI Response
        function askAI() {
            const input = document.getElementById('ai-input');
            const chat = document.getElementById('ai-chat');
            if (!input.value.trim()) return;

            const userText = input.value;
            chat.innerHTML += `<div class="bg-gray-100 p-2 rounded-lg text-gray-800 text-right"><strong>Du:</strong> ${userText}</div>`;
            input.value = '';
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                chat.innerHTML += `<div class="bg-brand-50 p-2 rounded-lg text-brand-900">💡 <strong>KI:</strong> Gute Frage! Um ${userText} zu lösen, teile die Aufgabe am besten in kleine Schritte auf. Soll ich dir ein Beispiel zeigen?</div>`;
                chat.scrollTop = chat.scrollHeight;
            }, 800);
        }

        // Reset Data Helper
        function resetAllData() {
            if (confirm('Möchtest du wirklich alle Aufgaben zurücksetzen?')) {
                localStorage.removeItem('studyplan_tasks');
                tasks = defaultTasks;
                renderContent();
            }
        }

        function toggleNotifications() {
            alert('Benachrichtigungen sind aktiviert!');
        }

        // Initial Render
        renderContent();
    </script>
</body>
</html>
