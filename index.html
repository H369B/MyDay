<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPlan AI</title>
    <style>
        /* Grundlegende Farben aus deiner Farbpalette */
        :root {
            --primary: #FFD54F;
            --primary-light: #FFE9A8;
            --accent: #5B3A1E;
            --bg-light: #FFF6E0;
            --card-bg: #FFFFFF;
            --text-dark: #3A3A3A;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Smartphone Rahmen */
        .app-container {
            width: 100%;
            max-width: 360px;
            height: 700px;
            background-color: #FAFAFA;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 8px solid #333;
            position: relative;
        }

        /* Header */
        .app-header {
            padding: 20px;
            background-color: #FFF;
        }

        .app-header h2 {
            margin: 0 0 15px 0;
            font-size: 20px;
            color: var(--text-dark);
        }

        /* Tagesziel Karte */
        .target-card {
            background-color: var(--bg-light);
            border-radius: 15px;
            padding: 15px;
            position: relative;
        }

        .target-title {
            font-weight: bold;
            color: var(--accent);
        }

        .target-sub {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 8px;
            background-color: #E0E0E0;
            border-radius: 4px;
            overflow: hidden;
            width: 80%;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary);
        }

        .target-status {
            position: absolute;
            right: 15px;
            bottom: 12px;
            font-weight: bold;
            font-size: 12px;
        }

        /* Hauptbereich */
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .content h3 {
            margin-top: 0;
            font-size: 16px;
            color: var(--text-dark);
        }

        /* Zeitleiste */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timeline-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .time {
            font-size: 12px;
            font-weight: bold;
            color: #777;
            width: 40px;
        }

        .event-card {
            flex: 1;
            background-color: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .duration {
            font-size: 11px;
            color: #999;
        }

        /* Button */
        .add-button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background-color: var(--primary);
            border: none;
            border-radius: 12px;
            font-weight: bold;
            color: var(--accent);
            cursor: pointer;
        }

        /* Navigation unten */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background-color: #FFF;
            padding: 10px 0;
            border-top: 1px solid #EEE;
        }

        .nav-item {
            background: none;
            border: none;
            font-size: 11px;
            color: #888;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Smartphone Container -->
    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <h2>Guten Morgen! ☀️</h2>
            <div class="target-card">
                <div class="target-title">🎯 Tagesziel</div>
                <div class="target-sub">3 Aufgaben erledigen</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 66%;"></div>
                </div>
                <span class="target-status">2 / 3</span>
            </div>
        </header>

        <!-- Main Content: Heute Übersicht -->
        <main class="content">
            <h3>Heute – 15. Mai</h3>

            <div class="timeline">
                <div class="timeline-item">
                    <span class="time">08:00</span>
                    <div class="event-card">🏫 Schule</div>
                </div>
                <div class="timeline-item">
                    <span class="time">14:30</span>
                    <div class="event-card">⏱️ Mathe lernen <span class="duration">45 Min</span></div>
                </div>
                <div class="timeline-item">
                    <span class="time">16:00</span>
                    <div class="event-card">☑️ Hausaufgaben <span class="duration">1 Std</span></div>
                </div>
                <div class="timeline-item">
                    <span class="time">18:00</span>
                    <div class="event-card">⚽ Fußball</div>
                </div>
                <div class="timeline-item">
                    <span class="time">20:00</span>
                    <div class="event-card">📖 Englisch lernen <span class="duration">30 Min</span></div>
                </div>
            </div>

            <button class="add-button">+ Aufgabe hinzufügen</button>
        </main>

        <!-- Navigation unten -->
        <nav class="bottom-nav">
            <button class="nav-item active">🏠<br>Heute</button>
            <button class="nav-item">📅<br>Plan</button>
            <button class="nav-item">☑️<br>Aufgaben</button>
            <button class="nav-item">🎁<br>Lernen</button>
            <button class="nav-item">👤<br>Profil</button>
        </nav>

    </div>

</body>
</html>
