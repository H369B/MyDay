<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyPlan AI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Smartphone Container -->
    <div class="app-container">
        
        <!-- Header -->
        <header class="app-header">
            <h2>Guten Morgen! ☀️</h2>
            <div class="target-card">
                <div class="target-title">🎯 Tagesziel</div>
                <div class="target-sub">3 Aufgaben erledigen</div>
                <div class="progress-bar">
                    <div class="progress-fill" style="width: 66%;"></div>
                </div>
                <span class="target-status">2 / 3</span>
            </div>
        </header>

        <!-- Main Content: Heute Übersicht -->
        <main class="content">
            <h3>Heute – 15. Mai</h3>

            <div class="timeline">
                <div class="timeline-item">
                    <span class="time">08:00</span>
                    <div class="event-card">🏫 Schule</div>
                </div>
                <div class="timeline-item">
                    <span class="time">14:30</span>
                    <div class="event-card">⏱️ Mathe lernen <span class="duration">45 Min</span></div>
                </div>
                <div class="timeline-item">
                    <span class="time">16:00</span>
                    <div class="event-card">☑️ Hausaufgaben <span class="duration">1 Std</span></div>
                </div>
                <div class="timeline-item">
                    <span class="time">18:00</span>
                    <div class="event-card">⚽ Fußball</div>
                </div>
                <div class="timeline-item">
                    <span class="time">20:00</span>
                    <div class="event-card">📖 Englisch lernen <span class="duration">30 Min</span></div>
                </div>
            </div>

            <button class="add-button">+ Aufgabe hinzufügen</button>
        </main>

        <!-- Navigation unten -->
        <nav class="bottom-nav">
            <button class="nav-item active">🏠<br>Heute</button>
            <button class="nav-item">📅<br>Plan</button>
            <button class="nav-item">☑️<br>Aufgaben</button>
            <button class="nav-item">🎁<br>Lernen</button>
            <button class="nav-item">👤<br>Profil</button>
        </nav>

    </div>

</body>
</html>
